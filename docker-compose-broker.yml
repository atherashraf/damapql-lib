# ==============================================================================
# Docker Compose: RabbitMQ Message Broker (with Management Dashboard)
# Storage Mode: Host Bind Mount (Persists directly to /var/lib/rabbitmq/data)
# ==============================================================================
#
# STORAGE BEHAVIOR & PERSISTENCE NOTICE:
# - Uses direct Host Bind Mount: <HOST_PATH>:<CONTAINER_PATH>
# - All persistent message queues, task states, exchange definitions, and
#   user credentials persist on your Ubuntu host at:
#       /var/lib/rabbitmq/data
# - When stopping or restarting (`docker compose down` -> `up`), in-flight tasks
#   and queue configurations remain 100% intact.
#
# ------------------------------------------------------------------------------
# ONE-TIME HOST INITIALIZATION (Run once before initial launch):
# ------------------------------------------------------------------------------
# 1. Create the persistent host directory:
#    sudo mkdir -p /var/lib/rabbitmq/data
#
# 2. Grant permissions to RabbitMQ container user (UID/GID 999):
#    sudo chown -R 999:999 /var/lib/rabbitmq/data
#    sudo chmod 700 /var/lib/rabbitmq/data
#
# ------------------------------------------------------------------------------
# LIFECYCLE COMMANDS:
# ------------------------------------------------------------------------------
# Launch broker:
#    docker compose -f docker-compose-broker.yml up -d
#
# View broker logs:
#    docker compose -f docker-compose-broker.yml logs -f
#
# Stop safely:
#    docker compose -f docker-compose-broker.yml down
#
# ------------------------------------------------------------------------------
# PORTS & ENDPOINTS:
# ------------------------------------------------------------------------------
# AMQP Broker Port:    5672   (For Celery / FastAPI connection string)
# Management Web UI:   15672  (Browser: http://<SERVER_IP>:15672)
#
# CONNECTION STRING (.env):
#    RABBITMQ_URL=amqp://wasa_admin:wasa_secret@127.0.0.1:5672//
# ==============================================================================

version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wasa-broker
    restart: always

    # Fixed hostname ensures RabbitMQ associates its mnesia database cleanly on restart
    hostname: wasa-rabbitmq-node

    environment:
      # Root administrative credentials
      RABBITMQ_DEFAULT_USER: wasa_admin
      RABBITMQ_DEFAULT_PASS: wasa_secret
      RABBITMQ_DEFAULT_VHOST: /
      # Ensure data directory maps into the host volume mount
      RABBITMQ_MNESIA_DIR: /var/lib/rabbitmq/mnesia

    ports:
      # AMQP protocol messaging port
      - "5672:5672"
      # RabbitMQ Management Web Dashboard
      - "15672:15672"

    volumes:
      # Left (Host): /var/lib/rabbitmq/data
      # Right (Container): /var/lib/rabbitmq
      - /var/lib/rabbitmq/data:/var/lib/rabbitmq

    networks:
      - wasa_net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

networks:
  wasa_net:
    external: true