# ==============================================================================
# Production Docker Compose Template: DAMapQL Geospatial Engine
# Supported Modules: WASA, LBDC, PULSE, etc.
# Network Architecture: Pure Host Mode (network_mode: host)
# Data Persistence: Direct Host Bind Mounts (/var/lib/damapql/...)
# ==============================================================================
#
# STORAGE BEHAVIOR & PERSISTENCE NOTICE:
# - All persistent database tables, spatial geometries, S3 buckets, message
#   queues, and cache entries reside directly on the host filesystem under:
#       /var/lib/damapql/...
# - Executing `docker compose down` or `docker compose down -v` does NOT erase
#   or modify these host files.
# - Containers detect existing database clusters, MinIO buckets, and GeoParquet
#   objects on every restart and resume without data loss.
#
# ------------------------------------------------------------------------------
# ONE-TIME HOST INITIALIZATION (Run once before initial launch):
# ------------------------------------------------------------------------------
# sudo mkdir -p /var/lib/damapql/postgresql/data \
#               /var/lib/damapql/minio/data \
#               /var/lib/damapql/redis/data \
#               /var/lib/damapql/rabbitmq/data \
#               /var/lib/damapql/duckdb/data
#
# # Assign container daemon user IDs
# sudo chown -R 999:999 /var/lib/damapql/postgresql/data /var/lib/damapql/rabbitmq/data
# sudo chown -R 1000:1000 /var/lib/damapql/minio/data /var/lib/damapql/redis/data
# sudo chmod 700 /var/lib/damapql/postgresql/data /var/lib/damapql/rabbitmq/data
# sudo chmod -R 775 /var/lib/damapql/minio/data /var/lib/damapql/redis/data
# sudo chmod -R 777 /var/lib/damapql/duckdb/data
#
# ------------------------------------------------------------------------------
# SELECTIVE DEPLOYMENT PROFILES:
# ------------------------------------------------------------------------------
# 1. Start DAMapQL App + Worker only (if datastores run directly on bare metal):
#      docker compose up -d
#
# 2. Start Core App + PostGIS + MinIO:
#      docker compose --profile storage up -d
#
# 3. Start Full Platform Stack (App, Worker, PostGIS, MinIO, Redis, RabbitMQ, DuckDB):
#      docker compose --profile storage --profile cache --profile broker --profile analytics up -d
# ==============================================================================

version: "3.8"

services:
  # ============================================================================
  # 1. DAMAPQL CORE APPLICATION & BACKGROUND WORKERS
  # ============================================================================

  # DAMapQL Backend API Engine & Dynamic MVT Vector Tile Server
  damapql_be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: damapql_be
    network_mode: host
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app:cached
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://damapql_user:damapql_password@127.0.0.1:5432/damapql_db
      - MINIO_ENDPOINT=127.0.0.1:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=False
      - MINIO_BUCKET=damapql
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://damapql_admin:damapql_secret@127.0.0.1:5672//
    command: ["python", "main.py"]

  # DAMapQL Ingestion Worker (Shapefile processing, EPSG normalization, GeoParquet conversion)
  damapql_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: damapql_worker
    network_mode: host
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app:cached
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://damapql_user:damapql_password@127.0.0.1:5432/damapql_db
      - MINIO_ENDPOINT=127.0.0.1:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=False
      - MINIO_BUCKET=damapql
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://damapql_admin:damapql_secret@127.0.0.1:5672//
    command: ["celery", "-A", "app.core.celery", "worker", "--loglevel=info", "-c", "4", "-Q", "spatial_ingestion"]

  # ============================================================================
  # 2. PERSISTENCE LAYER (Optional via --profile storage)
  # ============================================================================

  # PostgreSQL 16 + PostGIS 3.4 Spatial Database
  damapql_postgis:
    image: postgis/postgis:16-3.4
    container_name: damapql_postgis
    profiles: ["storage"]
    network_mode: host
    restart: always
    environment:
      POSTGRES_USER: damapql_user
      POSTGRES_PASSWORD: damapql_password
      POSTGRES_DB: damapql_db
    volumes:
      - /var/lib/damapql/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U damapql_user -d damapql_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 Storage (Preserving multi-module raw packages, GeoParquet, and documents)
  damapql_minio:
    image: quay.io/minio/minio:latest
    container_name: damapql_minio
    profiles: ["storage"]
    network_mode: host
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - /var/lib/damapql/minio/data:/data
    command: server /data --address "127.0.0.1:9000" --console-address "0.0.0.0:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # 3. CACHING & BROKER LAYER (Optional via --profile cache / broker)
  # ============================================================================

  # Redis In-Memory Cache (MVT Tile Caching and fast spatial key eviction)
  damapql_redis:
    image: redis:7.2-alpine
    container_name: damapql_redis
    profiles: ["cache"]
    network_mode: host
    restart: unless-stopped
    command: redis-server --bind 127.0.0.1 --port 6379 --maxmemory 2gb --maxmemory-policy allkeys-lru --save "" --appendonly no
    volumes:
      - /var/lib/damapql/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ AMQP Broker (Task distribution across ingestion pipelines)
  damapql_broker:
    image: rabbitmq:3.13-management-alpine
    container_name: damapql_broker
    profiles: ["broker"]
    network_mode: host
    restart: always
    hostname: damapql-rabbitmq-node
    environment:
      RABBITMQ_DEFAULT_USER: damapql_admin
      RABBITMQ_DEFAULT_PASS: damapql_secret
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_MNESIA_DIR: /var/lib/rabbitmq/mnesia
    volumes:
      - /var/lib/damapql/rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================================
  # 4. ANALYTICAL QUERY ENGINE (Optional via --profile analytics)
  # ============================================================================

  # DuckDB Analytical REST Service (Direct SQL over S3 GeoParquets)
  damapql_duckdb:
    image: modernatx/duckdb-api:latest
    container_name: damapql_duckdb
    profiles: ["analytics"]
    network_mode: host
    restart: always
    environment:
      - DUCKDB_DATABASE=/data/damapql_analytics.duckdb
      - DUCKDB_READ_ONLY=false
    volumes:
      - /var/lib/damapql/duckdb/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3