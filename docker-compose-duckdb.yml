# ==============================================================================
# Docker Compose: DuckDB REST / HTTP Server
# Storage Mode: Host Bind Mount (Persists directly to /var/lib/duckdb/data)
# ==============================================================================
#
# STORAGE BEHAVIOR & PERSISTENCE NOTICE:
# - Uses a direct Host Bind Mount: <HOST_PATH>:<CONTAINER_PATH>
# - Your DuckDB databases (e.g., `analytics.duckdb`), temporary spooling files,
#   and spatial/parquet extension caches persist directly on your host at:
#       /var/lib/duckdb/data
# - When the container stops or restarts (`docker compose down` -> `up`),
#   all database tables, views, and Parquet metadata remain intact.
#
# ------------------------------------------------------------------------------
# ONE-TIME HOST INITIALIZATION (Run on Ubuntu host before first launch):
# ------------------------------------------------------------------------------
#    sudo mkdir -p /var/lib/duckdb/data
#    sudo chmod -R 777 /var/lib/duckdb/data
#
# ------------------------------------------------------------------------------
# LIFECYCLE COMMANDS:
# ------------------------------------------------------------------------------
# Launch in background:
#    docker compose -f docker-compose-duckdb.yml up -d
#
# View logs:
#    docker compose -f docker-compose-duckdb.yml logs -f
#
# Stop container safely (database files stay intact on host):
#    docker compose -f docker-compose-duckdb.yml down
# ==============================================================================

version: '3.8'

services:
  duckdb:
    image: modernatx/duckdb-api:latest
    container_name: wasa-duckdb
    restart: always

    ports:
      # HTTP API port for executing SQL queries
      - "8080:8080"

    environment:
      # Sets the database file path inside the container mount
      - DUCKDB_DATABASE=/data/wasa_analytics.duckdb
      - DUCKDB_READ_ONLY=false

    volumes:
      # Left (Host): /var/lib/duckdb/data
      # Right (Container): /data
      - /var/lib/duckdb/data:/data

    networks:
      - wasa_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  wasa_net:
    external: true