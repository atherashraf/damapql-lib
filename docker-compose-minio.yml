# ==============================================================================
# Docker Compose: Shared MinIO Object Storage
# Image: Docker Hardened MinIO
# Storage: Persistent Host Bind Mount
# ==============================================================================
#
# PURPOSE:
# Centralized S3-compatible object storage for multiple applications.
# Applications can maintain separate buckets or object prefixes.
#
# Supports:
# - Geospatial datasets (GeoParquet, GeoTIFF, ZIP, etc.)
# - Documents and generated reports
# - Application uploads and processed datasets
# - Other S3-compatible storage requirements
#
# ==============================================================================
# 1. STORAGE CONFIGURATION AND PERSISTENCE
# ==============================================================================
#
# Storage type: Host Bind Mount
#
# Host directory:      /var/lib/minio/data
# Container directory: /data
#
# Mapping:
#   /var/lib/minio/data:/data
#
# All buckets, objects and MinIO metadata are stored on the host.
#
# Persistence:
# - docker compose stop:
#     Stops the container without removing it.
#
# - docker compose down:
#     Stops and removes the container and Compose network.
#     The host bind-mounted storage directory remains intact.
#
# - docker compose down -v:
#     Removes Docker-managed volumes associated with the project.
#     Does not delete the bind-mounted host directory.
#
# - docker compose up -d:
#     Starts or recreates the container using the existing host directory.
#
# IMPORTANT:
# - Do not manually delete or modify MinIO internal metadata.
# - Do not assume that persistence replaces regular backups.
# - Back up existing data before changing MinIO versions.
# - Ensure compatibility before migrating an existing deployment.
#
# ==============================================================================
# 2. ONE-TIME HOST INITIALIZATION
# ==============================================================================
#
# Run these commands once for a NEW, EMPTY storage directory:
#
#   sudo mkdir -p /var/lib/minio/data
#   sudo chown 65532:65532 /var/lib/minio/data
#   sudo chmod 750 /var/lib/minio/data
#
# The selected Docker Hardened MinIO image runs as UID 65532.
#
# IMPORTANT:
# Do not recursively change ownership or permissions on an existing
# production directory without first inspecting and backing up its contents.
#
# ==============================================================================
# 3. ENVIRONMENT CONFIGURATION
# ==============================================================================
#
# Environment variables are loaded from the deployment's .env file.
#
# Required:
#   MINIO_ACCESS_KEY
#   MINIO_SECRET_KEY
#
# Application client settings:
#   MINIO_ENDPOINT
#   MINIO_SECURE
#
# Docker Compose maps:
#   MINIO_ACCESS_KEY -> MINIO_ROOT_USER
#   MINIO_SECRET_KEY -> MINIO_ROOT_PASSWORD
#
# MINIO_ENDPOINT and MINIO_SECURE are application client settings.
# They are not required by the MinIO container itself.
#
# Do not commit .env files or credentials to version control.
# Use strong credentials and restrict access to the .env file.
#
# ==============================================================================
# 4. DEPLOYMENT AND LIFECYCLE COMMANDS
# ==============================================================================
#
# Run the following commands from the deployment project root.
#  but before must create directory with permission in host
#  use  ONE-TIME HOST INITIALIZATION
#
# The examples assume:
#   .env
#   app/damapql/docker-compose-minio.yml
#
# Update these paths when using another deployment directory.
#
# Registry authentication (when required):
#
#   sudo docker login dhi.io -u YOUR_DOCKER_USERNAME
#
# Use a Docker Hub personal access token when prompted.
# Access to the selected image may require registry entitlement.
#
# Validate configuration:
#
#   sudo docker compose --env-file .env -f app/damapql/docker-compose-minio.yml config --quiet
#
# Start in background:
#
#   sudo docker compose --env-file .env -f app/damapql/docker-compose-minio.yml up -d
#
# Check container status:
#
#   sudo docker compose --env-file .env -f app/damapql/docker-compose-minio.yml ps
#
# View real-time logs:
#
#   sudo docker compose --env-file .env -f app/damapql/docker-compose-minio.yml logs -f
# Stop without removing the container:
#
#   sudo docker compose --env-file .env \
#     -f app/damapql/docker-compose-minio.yml stop
#
# Stop and remove the container:
#
#   sudo docker compose --env-file .env \
#     -f app/damapql/docker-compose-minio.yml down
#
# Restart or recreate:
#
#   sudo docker compose --env-file .env -f app/damapql/docker-compose-minio.yml up -d
#
#
# ==============================================================================
# 5. ENDPOINTS AND CONNECTIVITY
# ==============================================================================
#
# S3 API:
#   http://127.0.0.1:9000
#
# Web Console:
#   http://<HOST_IP>:9001
#
# Credentials:
#   Defined by MINIO_ACCESS_KEY and MINIO_SECRET_KEY.
#
# Client configuration:
#
# - Applications running directly on the Docker host:
#     MINIO_ENDPOINT=localhost:9000
#
# - Applications running in Docker on the same network:
#     MINIO_ENDPOINT=minio:9000
#
# - Applications running on other servers:
#     Use a reachable server address or configured DNS name.
#
# Docker applications must share an appropriate Docker network
# to communicate using the MinIO service hostname.
#
# ==============================================================================
# 6. HEALTH AND DIAGNOSTICS
# ==============================================================================
#
# Check MinIO's HTTP liveness endpoint from the Docker host:
#
#   curl -f http://127.0.0.1:9000/minio/health/live
#
# Expected result:
#   HTTP 200 indicates that the server is responding.
#
# Inspect container health:
#
#   sudo docker inspect damapql-minio \
#     --format='{{json .State.Health}}'
#
# The container healthcheck requires a compatible executable.
# Verify that the selected hardened image includes the required
# healthcheck utility.
#
# ==============================================================================
# 7. MULTI-APPLICATION STORAGE MANAGEMENT
# ==============================================================================
#
# This MinIO instance can serve multiple independent applications.
#
# Recommended organization:
# - Use separate buckets for applications requiring data isolation.
# - Alternatively, organize objects using application-specific prefixes.
# - Configure separate application credentials and access policies
#   when isolation is required.
# - Avoid sharing root credentials across production applications.
#
# Applications should access MinIO through its S3-compatible API.
# Do not directly manipulate objects inside the host storage directory.
#
# ==============================================================================
# 8. SECURITY AND BACKUP
# ==============================================================================
#
# - Restrict external access to ports 9000 and 9001.
# - Use HTTPS when exposing MinIO outside trusted networks.
# - Use least-privilege credentials for application access.
# - Maintain regular, independently verified backups.
# - Pin the image version and review security updates.
# - Review licensing and registry access before redeployment.
#
# ==============================================================================
# END OF CONFIGURATION NOTES
# ==============================================================================

services:
  minio:
    image: dhi.io/minio:0.20251015.172955
    container_name: damapql-minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}

    volumes:
      - /home/idss/idss_be/minio_data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s